version: '3.8'

services:
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luraph_analyzer_app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=a_very_secure_secret_for_luraph_analyzer
      - PORT=3000
    volumes:
      # Persist the SQLite database file outside the container
      - db-data:/app/prisma
    restart: always

volumes:
  db-data:
